name: stpt-quiz

services:
  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: quiz
      POSTGRES_PASSWORD: quiz
      POSTGRES_DB: quiz
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U quiz -d quiz"]
      interval: 3s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  app:
    build: ../backend
    environment:
      APP_PORT: "8080"
      DATABASE_URL: postgres://quiz:quiz@postgres:5432/quiz?sslmode=disable
      REDIS_ADDR: redis:6379
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-admin123}
      QUESTION_SECONDS: ${QUESTION_SECONDS:-20}
      QUESTION_COUNT: ${QUESTION_COUNT:-10}
      UPLOAD_DIR: /app/uploads
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - uploads:/app/uploads
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/healthz"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  # 前端构建产物 + 反向代理一体（本机 Nginx；TLS 由外部反代终止）
  web:
    build:
      context: ..
      dockerfile: deploy/web/Dockerfile
    ports:
      - "${WEB_PORT:-8080}:8080"
    volumes:
      - uploads:/usr/share/nginx/html/uploads
    depends_on:
      - app
    restart: unless-stopped

volumes:
  pgdata:
  uploads:
